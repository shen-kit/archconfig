# ~/.config/tmux/tmux.conf
# Topic files live in conf.d/. TPM bootstrap must stay last.

source-file ~/.config/tmux/conf.d/00-options.conf
source-file ~/.config/tmux/conf.d/10-plugins.conf
source-file ~/.config/tmux/conf.d/20-terminal.conf
source-file ~/.config/tmux/conf.d/30-appearance.conf
source-file ~/.config/tmux/conf.d/40-bindings.conf
source-file ~/.config/tmux/conf.d/50-sessions.conf

# Initialize TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
