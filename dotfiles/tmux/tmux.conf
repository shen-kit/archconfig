################################
# Plugins
################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'

################################
# Terminal / Key Support
################################

set -g default-shell "/bin/zsh"
set -g default-terminal "tmux-256color"
set -ga update-environment TERM_PROGRAM

set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g focus-events on

# xterm-ghostty comes from `echo $TERM` outside of tmux
set -as terminal-features ',xterm-ghostty:RGB,extkeys'

set -g escape-time 0
set -g detach-on-destroy off

# window format
set -g base-index 1
setw -g pane-base-index 1
set -g window-status-format " #W "
set -g window-status-current-format " #W "

# required by image.nvim
set -g visual-activity off

################################
# General
################################

set -g mouse on
set -g history-limit 50000
set -g display-time 4000

setw -g mode-keys vi

################################
# Appearance
################################

set -g status-position bottom
set -g status-style bg=#0b0022,fg=#dddddd
set -g status-interval 5

set -g pane-border-style fg=#444444
set -g pane-active-border-style fg=#d193d9

# tab style
setw -g window-status-current-style bg=#d193d9,fg=#000000,bold
setw -g window-status-style bg=#0b0022,fg=#dddddd

setw -g aggressive-resize on

set -g status-left ""
set -g status-right "#[bg=#3ebd40,fg=#111111] #(tmux display-message -p '#S') "

################################
# Leader
################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind R source-file ~/.config/tmux/tmux.conf

################################
# Windows
################################

# New tab
bind t new-window -c "#{pane_current_path}"

# New tab in home
bind c new-window -c "$HOME"

# Switch tabs
bind -n C-M-h previous-window
bind -n C-M-l next-window

# Move tabs
bind -n C-M-Left swap-window -d -t -1
bind -n C-M-Right swap-window -d -t +1

# Rename tab
bind , command-prompt "rename-window '%%'"


################################
# Panes
################################

# Split
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane

# Smart pane switching with awareness of Neovim splits.
bind-key -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-S-H if -F "#{@pane-is-vim}" 'send-keys M-S-H' 'resize-pane -L 3'
bind-key -n M-S-J if -F "#{@pane-is-vim}" 'send-keys M-S-J' 'resize-pane -D 3'
bind-key -n M-S-K if -F "#{@pane-is-vim}" 'send-keys M-S-K' 'resize-pane -U 3'
bind-key -n M-S-L if -F "#{@pane-is-vim}" 'send-keys M-S-L' 'resize-pane -R 3'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

################################
# Sessions
################################

# Next / prev workspace
bind -n M-n switch-client -n
bind -n M-p switch-client -p

bind f run-shell "tmux neww $HOME/.config/tmux/sessionizer"
bind l run-shell "tmux neww $HOME/.config/tmux/session-switcher"
bind k kill-session

# Obsidian workspace
bind o new-session -A -s notes \
  "nvim $HOME/syncthing/1_notes/Dashboard.md"


################################
# Disable Defaults
################################

unbind C-p
unbind C-Tab
unbind C-S-Tab
unbind C-l

# initialize tpm (must be the last line)
run '~/.tmux/plugins/tpm/tpm'
