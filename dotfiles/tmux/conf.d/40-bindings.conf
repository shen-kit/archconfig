################################
# Prefix / Config Reload
################################

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind R source-file ~/.config/tmux/tmux.conf
bind Escape copy-mode

################################
# Windows
################################

bind t new-window -c "#{pane_current_path}"
bind c new-window -c "$HOME"

bind -n C-M-h previous-window
bind -n C-M-l next-window

bind -n C-M-Left swap-window -d -t -1
bind -n C-M-Right swap-window -d -t +1

bind , command-prompt "rename-window '%%'"

################################
# Panes
################################

bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane

# @pane-is-vim is set by Neovim/tmux navigation integration in the Neovim config.
# Smart pane switching forwards movement keys to Neovim splits when current pane is vim.
bind-key -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Smart pane resizing forwards resize keys to Neovim splits when current pane is vim.
bind-key -n M-S-H if -F "#{@pane-is-vim}" 'send-keys M-S-H' 'resize-pane -L 3'
bind-key -n M-S-J if -F "#{@pane-is-vim}" 'send-keys M-S-J' 'resize-pane -D 3'
bind-key -n M-S-K if -F "#{@pane-is-vim}" 'send-keys M-S-K' 'resize-pane -U 3'
bind-key -n M-S-L if -F "#{@pane-is-vim}" 'send-keys M-S-L' 'resize-pane -R 3'

# Copy-mode pane navigation, selection, and clipboard copy.
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy-command}"

################################
# Disabled Default Bindings
################################

unbind C-p
unbind C-Tab
unbind C-S-Tab
unbind C-l
