################################
# Shared Options / Paths
################################

# Theme tokens used by appearance/status config.
set -g @theme-bg "#0b0022"
set -g @theme-fg "#dddddd"
set -g @theme-muted "#444444"
set -g @theme-accent "#d193d9"
set -g @theme-status-session-bg "#3ebd40"
set -g @theme-status-session-fg "#111111"
set -g @theme-status-alert-bg "#eba0ac" # left status bg (prefix/copy mode)
set -g @theme-status-alert-fg "#11111b" # left status fg

# Script/workspace paths. Override with `set -g @name value` before sourcing if needed.
set -g @notes-path "$HOME/syncthing/1_notes/Dashboard.md"
set -g @sessionizer-script "$HOME/.config/tmux/sessionizer"
set -g @sessionizer-edit-script "$HOME/.config/tmux/sessionizer-edit"
set -g @session-switcher-script "$HOME/.config/tmux/session-switcher"
