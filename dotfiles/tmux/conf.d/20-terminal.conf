################################
# Shell / Terminal / Input
################################

# Use login shell from environment instead of host-specific hard-code.
set -g default-shell "/usr/bin/zsh"
set -g default-terminal "tmux-256color"
set -ga update-environment TERM_PROGRAM

# CSI-u extended keys allow modified key combos like M-S-H in capable terminals/editors.
set -g extended-keys on
set -g extended-keys-format csi-u

# allow-passthrough lets terminal apps pass escape sequences through tmux; needed by image.nvim.
set -g allow-passthrough on
set -g focus-events on

# xterm-ghostty comes from `echo $TERM` outside tmux; RGB enables truecolor, extkeys preserves extended key support.
set -as terminal-features ',xterm-ghostty:RGB,extkeys'

set -g escape-time 0
set -g detach-on-destroy off

# Prefer terminal clipboard integration. Copy-mode y binding in bindings.conf pipes to OS clipboard when available.
set -s set-clipboard on
set -g @copy-command "cat >/dev/null"
if-shell -b 'command -v wl-copy >/dev/null 2>&1' \
  'set -g @copy-command "wl-copy"' \
  'if-shell -b "command -v xclip >/dev/null 2>&1" "set -g @copy-command \"xclip -selection clipboard -in\"" "if-shell -b \"command -v pbcopy >/dev/null 2>&1\" \"set -g @copy-command pbcopy\""'
