################################
# General Behavior
################################

set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g visual-activity off # required by image.nvim

setw -g mode-keys vi
setw -g aggressive-resize on

################################
# Indexing / Window Formats
################################

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g window-status-format " #W "
set -g window-status-current-format " #W "
set -g window-status-separator ""

################################
# Status / Appearance
################################

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#{@theme-bg},fg=#{@theme-fg}"

# Commas inside conditional style blocks must be escaped as `#,` or tmux parses them as conditional separators.
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#{@theme-status-alert-bg}#,fg=#{@theme-status-alert-fg}#,bold] PRE ,}#{?pane_in_mode,#[bg=#{@theme-status-alert-bg}#,fg=#{@theme-status-alert-fg}#,bold] COPY ,}"
set -g status-right "#[bg=#{@theme-status-session-bg},fg=#{@theme-status-session-fg}] #S "

set -g pane-border-style "fg=#{@theme-muted}"
set -g pane-active-border-style "fg=#{@theme-accent}"

setw -g window-status-style "bg=#{@theme-bg},fg=#{@theme-fg}"
setw -g window-status-current-style "bg=#{@theme-accent},fg=#000000,bold"
