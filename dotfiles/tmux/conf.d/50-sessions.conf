################################
# Sessions / Workspaces
################################

bind -n M-n switch-client -n
bind -n M-p switch-client -p

# Helper popups close when script exits. Scripts exit 0 on empty fzf selection.
# Popup shell-command does not expand tmux formats, so resolve script @options inside popup via `tmux show -gv`.
bind e display-popup -E -w 60 -h 25 "bash -lc 'exec \"$(tmux show -gv @sessionizer-edit-script)\"'"
bind f display-popup -E -w 60 -h 25 "bash -lc 'exec \"$(tmux show -gv @sessionizer-script)\"'"
bind l display-popup -E -w 60 -h 25 "bash -lc 'exec \"$(tmux show -gv @session-switcher-script)\"'"

bind k kill-session

# new-session shell-command does not expand tmux formats; resolve @notes-path in shell.
bind o new-session -A -s notes \
  "sh -c 'exec nvim \"$1\"' sh \"$(tmux show -gv @notes-path)\""
